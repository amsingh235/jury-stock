# Reference statistics attached to each detected pattern (spec §5).
#
# WARNING: every figure below is an APPROXIMATE PLACEHOLDER written from memory of
# Bulkowski's Encyclopedia of Chart Patterns (2nd ed., 2005) and thepatternsite.com
# summaries. None has been checked against the source, so all carry verified: false.
# Replace each with the published number (daily data, bull market, breakout in the
# pattern's direction) and set verified: true. Agents are told to flag unverified stats.
#
# failure_rate_pct: share of patterns failing to move 10% after breakout (Bulkowski's
#                   "10% failure rate"); avg_move_pct: average move after breakout;
# frequency_rank:   Bulkowski performance rank out of ~39 bull-market patterns (lower is better).
